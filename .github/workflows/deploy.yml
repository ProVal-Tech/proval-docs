name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Run deploys one at a time so impact scores cached by one run are picked up by the next
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore cached impact scores
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/impact-scores
          key: impact-scores-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: impact-scores-

      - name: Build recent documents list
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          # Start from the cached copy so docs scored in earlier deploys are skipped
          $cachedDocs = Join-Path $env:RUNNER_TEMP 'impact-scores/recentDocs.json'
          if (Test-Path $cachedDocs) {
              Copy-Item $cachedDocs static/api/recentDocs.json -Force
          }
          . helper_scripts/Update-RecentDocList.ps1
          New-Item -ItemType Directory -Path (Split-Path $cachedDocs) -Force | Out-Null
          Copy-Item static/api/recentDocs.json $cachedDocs -Force

      - name: Save impact scores to cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/impact-scores
          key: impact-scores-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4